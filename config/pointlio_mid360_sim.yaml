/**:
    ros__parameters:
        # —— 下列为仿真调参（原 bringup 内嵌，已回归本包，R1）——
        use_imu_as_input: false      # Change to True to use IMU as input of Point-LIO
        prop_at_freq_of_imu: true
        check_satu: false
        init_map_size: 10
        point_filter_num: 3          # Options: 1, 3
        space_down_sample: true
        filter_size_surf: 0.5        # Options: 0.5, 0.3, 0.2, 0.15, 0.1
        filter_size_map: 0.5         # Options: 0.5, 0.3, 0.15, 0.1
        ivox_nearby_type: 26         # Options: 0, 6, 18, 26
        runtime_pos_log_enable: false
        common:
            lid_topic: "/livox/lidar"
            imu_topic: "/livox/imu"
            con_frame: false # true: if you need to combine several LiDAR frames into one
            con_frame_num: 1 # the number of frames combined
            cut_frame: false # true: if you need to cut one LiDAR frame into several subframes
            cut_frame_time_interval: 0.166666 # should be integral fraction of 1 / LiDAR frequency
            time_diff_lidar_to_imu: 0.0 # Time offset between LiDAR and IMU calibrated by other algorithms, e.g., LI-Init (find in Readme)

        preprocess:
            lidar_type: 1      # 1 for Livox serials LiDAR, 2 for Velodyne LiDAR, 3 for ouster LiDAR
            scan_line: 4
            timestamp_unit: 3   # the unit of time/t field in the PointCloud2 rostopic: 0-second, 1-milisecond, 2-microsecond, 3-nanosecond.
            blind: 0.5

        mapping:
            imu_en: true
            start_in_aggressive_motion: false # if true, a preknown gravity should be provided in following gravity_init
            extrinsic_est_en: false # for aggressive motion, set this variable false
            imu_time_inte: 0.01612 # = 1 / frequency of IMU
            satu_acc: 3.0 # the saturation value of IMU's acceleration. not related to the units
            satu_gyro: 35.0 # the saturation value of IMU's angular velocity. not related to the units
            acc_norm: 9.81 # 1.0 for g as unit, 9.81 for m/s^2 as unit of the IMU's acceleration
            lidar_meas_cov: 0.01 # 0.001
            acc_cov_output: 500.0
            gyr_cov_output: 1000.0
            b_acc_cov: 0.0001
            b_gyr_cov: 0.0001
            imu_meas_acc_cov: 0.6 #0.1 # 2
            imu_meas_omg_cov: 0.6 #0.1 # 2
            gyr_cov_input: 0.01 # for IMU as input model
            acc_cov_input: 0.1 # for IMU as input model
            plane_thr: 0.1 # 0.05, the threshold for plane criteria, the smaller, the flatter a plane
            match_s: 81.0
            fov_degree: 360.0
            det_range: 100.0
            gravity_align: true # true to align the z axis of world frame with the direction of gravity, and the gravity direction should be specified below
            gravity: [ 0.0, 0.0, -9.810 ] # [0.0, 9.810, 0.0] # gravity to be aligned
            gravity_init: [ 0.0, 0.0, -9.810 ] # [0.0, 9.810, 0.0] # # preknown gravity in the first IMU body frame, use when imu_en is false or start from a non-stationary state
            extrinsic_T: [ 0.0, 0.0, 0.05 ] # Simulation：livox 原点在 IMU 系里沿共同 z 偏 5 cm
            # ★ 2026-10-27（契约 §4.12.5 / measurements §35）：**本文件自己的默认值**
            #   = robot11 仿真（唯一斜装槽位）的物理事实：点云在水平的 `livox_frame`、IMU 在
            #   `imu_link` 里真的绕 x −30° ⇒ p_imu = R_IL·p_lidar + t_IL 里的
            #   R_IL = Rx(+30°)（= 倾角矩阵的逆）。**不是**单位阵 —— 单位阵会静默丢掉 30°。
            #   谁覆盖它：`bringup_sim.launch.py` 对**所有** robot 都会从 URDF 解析并覆盖
            #   `mapping.extrinsic_R`（唯一真源是 URDF）⇒ 默认模型/hzmirm 在 launch 下仍是 I。
            #   但**独立使用本 yaml**（直接 `ros2 run point_lio pointlio_mapping --params-file …`）
            #   时不会走 launch 的解析 ⇒ 这里的默认值必须是真值，不能是 I。
            extrinsic_R: [1., 0., 0.,
                          0., 0.8660254037844387, -0.5,       # cos30, -sin30
                          0., 0.5, 0.8660254037844387]        # sin30,  cos30

        odometry:
            publish_odometry_without_downsample: false

        publish:
            path_en: true                 # false: close the path output

        map_file_path: "src/rm_nav_bringup/PCD/RMUL2026.pcd"

        pcd_save:
            pcd_save_en: true
            interval: 100